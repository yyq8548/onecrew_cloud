services:
  model:
    image: ghcr.io/ggml-org/llama.cpp@sha256:8c74db29f1a2bef3f0a331b52c4d6214601dfceed4bee0b94cc48b3b23ff257d
    user: "1000:1000"
    read_only: true
    mem_limit: 7g
    cpus: 6
    ports:
      - "127.0.0.1:8789:8080"
    volumes:
      - type: bind
        source: ${ONECREW_MODEL_DIRECTORY:?Set the absolute directory containing the verified model}
        target: /models
        read_only: true
    command:
      - --model
      - /models/Qwen3-4B-Q4_K_M.gguf
      - --alias
      - onecrew-qwen3-4b-q4
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "8192"
      - --parallel
      - "1"
      - --threads
      - "6"
      - --n-gpu-layers
      - "0"
      - --jinja
      - --chat-template-kwargs
      - '{"enable_thinking":false}'
      - --no-webui
      - --no-slots
